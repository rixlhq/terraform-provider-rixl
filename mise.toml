[tools]
go = "1.27"
golangci-lint = "2.13.1"
lefthook = "2.1.11"
terraform = "1.15.8"
"ubi:goreleaser/goreleaser" = "2.17.1"
"go:github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs" = "v0.25.0"

[hooks]
postinstall = "lefthook install"

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -w -s ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.build]
description = "Build the provider"
run = "go build -v ./..."

[tasks.install]
description = "Install the provider binary"
depends = ["build"]
run = "go install -v ./..."

[tasks.test]
description = "Run unit tests"
run = "go test -v -race ./..."

[tasks.testacc]
description = "Run acceptance tests (requires real credentials)"
env = { TF_ACC = "1" }
run = "go test -v -cover -timeout=120m ./..."

[tasks.bench]
description = "Run benchmarks"
run = "go test -bench=. -benchmem ./..."

[tasks.docs]
description = "Generate Terraform Registry docs"
run = "tfplugindocs generate"

[tasks.default]
description = "Default local development check"
run = [
  { task = "fmt" },
  { task = "build" },
  { task = "test" },
  { task = "lint" },
]
