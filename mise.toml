[tools]
jactionlint = "2.2.0"
go = "1.27"
terraform = "1.16.6"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
"github:goreleaser/goreleaser" = "2.18.3"
"go:github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs" = "v0.25.0"

[hooks]
postinstall = "lefthook install"

[tasks.build]
description = "Build the provider"
run = "go build -v ./..."

[tasks.install]
description = "Install the provider binary"
depends = ["build"]
run = "go install -v ./..."

[tasks.test]
description = "Run unit tests"
usage = 'arg "<pkg>" default="./..."'
run = "go test -v -cover -timeout=120s -parallel=10 ${usage_pkg?}"

[tasks.testacc]
description = "Run acceptance tests with TF_ACC=1"
usage = 'arg "<pkg>" default="./..."'
env = { TF_ACC = "1" }
run = "go test -v -race -cover -timeout=120m -parallel=10 ${usage_pkg?}"

[tasks.bench]
description = "Run benchmarks"
run = "go test -bench=. -benchmem ./..."

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -s -w -e ."

[tasks.fmt-check]
description = "Check Go formatting"
run = "gofmt -s -l -e ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.docs]
description = "Generate Terraform Registry docs"
run = "tfplugindocs generate --provider-name rixl"

[tasks.docs-check]
description = "Validate Terraform Registry docs"
run = 'tfplugindocs validate --provider-name rixl --allowed-guide-subcategories "Guides" --allowed-resource-subcategories "Video & Media,Projects & Content,Custom Domains,Identity & Access Management (IAM),Organizations & Collaboration,Dashboards & Analytics,Billing & Subscriptions"'

[tasks.default]
description = "Default local development check"
run = [
  { task = "fmt" },
  { task = "build" },
  { task = "test" },
  { task = "lint" },
]
